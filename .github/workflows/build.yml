name: Profile card

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ACCESS_TOKEN yoksa GitHub sayıları önbellekten gelir; App Store ve akış yine güncellenir
      - name: Build SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python profile.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add *.svg cache/
          git diff --cached --quiet && exit 0
          git commit -m "Update profile stats"
          git push
