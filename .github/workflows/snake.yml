name: Contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # snk hız ayarı açmıyor; keyframe'ler süreye göre yüzde olduğu için süreyi ölçeklemek yeterli
      - name: Speed up snake
        run: |
          python3 - <<'EOF'
          import pathlib, re
          for p in pathlib.Path("dist").glob("*.svg"):
              p.write_text(re.sub(r"(\d+)ms", lambda m: f"{round(int(m.group(1)) * 0.4)}ms", p.read_text()))
          EOF

      # görseller main'i kirletmesin diye ayrı dal
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
