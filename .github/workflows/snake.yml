name: Contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # snk Docker'da root olarak yazıyor; sahiplik geçmeden dosyalar düzenlenemez
      - name: Style snake card
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 tools/snake_card.py dist

      # görseller main'i kirletmesin diye ayrı dal
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
